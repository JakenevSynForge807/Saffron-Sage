<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saffron & Sage - Sign up</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    {% extends "base.html" %}

    {% block content %}

    <div class="signup-content">

        <section class="signup-top">
            <h3>🌿 Create account</h3>
            <p>Join the marketplace</p>
        </section>

        {% if contactMessage %}

        <p style="color: green; text-align: center;">{{signupMessage}}</p>

        {% endif %}

        <section class="signup-content">
            <form class="signup-form" method="POST" action="/signup">
                <div class="signup-form-group">
                    <label>Full name <span class="asterisk">*</span></label>
                    <input type="text" placeholder="John Ross" name="name" required>
                </div>

                <div class="signup-form-group">
                    <label>Email <span class="asterisk">*</span></label>
                    <input type="email" placeholder="johnross123@email.com" name="email" required>
                </div>

                <div class="signup-form-group">
                    <label>Password <span class="asterisk">*</span></label>
                    <input type="password" placeholder="#john123" name="password" required>
                </div>

                <div class="signup-form-group">
                    <label>I want to...<span class="asterisk">*</span></label>

                    <div class="roles">
                        <label class="role-opt sel">
                            <div class="ic">🛒</div><b>Buy food</b><small>Browse &amp; order</small>
                            <input type="radio" name="role" value="buyer" checked hidden>
                        </label>
                        <label class="role-opt">
                            <div class="ic">🍳</div><b>Sell food</b><small>List &amp; fulfil</small>
                            <input type="radio" name="role" value="seller" hidden>
                        </label>
                    </div>
                </div>

                <div>
                    <button type="submit">Create account</button>
                </div>

                <p>Already have one? <a href="/login">Log in</a></p>
            </form>
        </section>

    </div>

    {% endblock %}
</body>

</html>
