{% extends "base.html" %}

{% block content %}

<div class="buyer-dashboard-page">

    <div class="buyer-dashboard">

        <section class="buyer-dashboard-top">
            <h2>TODAY'S KITCHEN</h2>
            <h1>Browse Dishes</h1>
            <p>Every dish from every seller. Click order to add it.</p>
        </section>

        <div class="buyer-dashboard-content-wrapper">

            <section class="buyer-dashboard-content">
                <p>🍽️</p>
                <h2>Pan-Seared Sea Bass</h2>
                <h3>£18.00</h3>
                <p>by The Olive Kitchen</p>

                <form class="buyer-dashboard-form">
                    <input type="number" name="quantity" min="1" value="1">
                    <button type="submit">Order</button>
                </form>
            </section>

        </div>

    </div>
</div>

{% endblock %}
