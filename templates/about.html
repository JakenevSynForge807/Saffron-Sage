<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Saffron & Sage - About</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    {% extends "base.html" %}

    {% block content %}

    <section class="top-content">
        <div>
            <h1 class="icon">📷</h1>
        </div>

        <div>
            <h3>OUR STORY</h3>
            <h2>From Farm to Table</h2>
            <p>Two friends, one kitchen, a shared love <br> of seasonal food. Founded in 2026...</p>
        </div>
    </section>

    <section class="bottom-content">
        <h3 class="bottom-title">Meet the Team</h3>

        <div class="about-cards">
            <div class="about-card">
                <h1 class="icon">🧑🏻‍🍳</h1>
                <h3>Head Chef</h3>
            </div>

            <div class="about-card">
                <h1 class="icon">👩🏻‍🍳</h1>
                <h3>Sous Chef</h3>
            </div>

            <div class="about-card">
                <h1 class="icon">👩🏻‍💼</h1>
                <h3>Manager</h3>
            </div>
        </div>
    </section>

    {% endblock %}
</body>

</html>
